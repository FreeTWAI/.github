<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-labelledby="title desc">
  <title id="title">FreeTWAI — 自由工坊 Freedom Platform</title>
  <desc id="desc">霓虹賽博城市夜景：台北 101 天際線、透視網格地面與閃爍的 FREETWAI 標題。標語：沒有守門人，只有建造者。</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05010d"/>
      <stop offset="0.55" stop-color="#14022e"/>
      <stop offset="0.72" stop-color="#3a0645"/>
      <stop offset="0.73" stop-color="#07020f"/>
      <stop offset="1" stop-color="#020006"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#05d9e8"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ff2a6d"/>
    </linearGradient>
    <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff2a6d" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff2a6d" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.72" r="0.55">
      <stop offset="0" stop-color="#ff2a6d" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff2a6d" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-10%" y="-50%" width="120%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" fill-opacity="0.35"/>
    </pattern>
    <polygon id="seg101" points="-15,0 15,0 22,-17 -22,-17"/>
    <style>
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; }
      .cjk  { font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', 'Heiti TC', sans-serif; }
      .rain { stroke: #05d9e8; stroke-opacity: 0.35; stroke-width: 1; animation: fall 1.1s linear infinite; }
      .rain.b { animation-duration: 0.8s; stroke-opacity: 0.22; }
      .rain.c { animation-duration: 1.4s; stroke: #ff2a6d; stroke-opacity: 0.25; }
      @keyframes fall { from { transform: translateY(-60px); } to { transform: translateY(460px); } }
      .glitchC { animation: gC 3.2s steps(1) infinite; }
      .glitchM { animation: gM 3.2s steps(1) infinite; }
      @keyframes gC {
        0%, 86%, 100% { transform: translate(-3px, 0); opacity: 0.8; }
        88% { transform: translate(-14px, 2px); opacity: 1; }
        91% { transform: translate(9px, -3px); opacity: 0.6; }
        94% { transform: translate(-6px, 1px); opacity: 1; }
      }
      @keyframes gM {
        0%, 86%, 100% { transform: translate(3px, 0); opacity: 0.8; }
        88% { transform: translate(12px, -2px); opacity: 1; }
        91% { transform: translate(-10px, 3px); opacity: 0.6; }
        94% { transform: translate(5px, -1px); opacity: 1; }
      }
      .flicker { animation: flicker 5s linear infinite; }
      @keyframes flicker {
        0%, 18%, 22%, 62%, 64%, 100% { opacity: 1; }
        20%, 63% { opacity: 0.35; }
      }
      .blink { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .sweep { animation: sweep 4s linear infinite; }
      @keyframes sweep { from { transform: translateY(305px); } to { transform: translateY(440px); } }
      .beacon { animation: beacon 1.6s ease-in-out infinite; }
      @keyframes beacon { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
      .win { animation: win 6s steps(1) infinite; }
      .win.d1 { animation-delay: -1.5s; }
      .win.d2 { animation-delay: -3s; }
      .win.d3 { animation-delay: -4.5s; }
      @keyframes win { 0%, 70% { opacity: 0.9; } 71%, 85% { opacity: 0.15; } 86% { opacity: 0.9; } }
    </style>
  </defs>

  <!-- sky + horizon halo -->
  <rect width="1200" height="440" fill="url(#sky)"/>
  <rect width="1200" height="440" fill="url(#halo)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="80" cy="40" r="1" opacity="0.6"/><circle cx="210" cy="92" r="1.2" opacity="0.4"/>
    <circle cx="330" cy="30" r="0.8" opacity="0.7"/><circle cx="470" cy="70" r="1" opacity="0.35"/>
    <circle cx="690" cy="34" r="1.1" opacity="0.5"/><circle cx="780" cy="96" r="0.8" opacity="0.6"/>
    <circle cx="880" cy="50" r="1" opacity="0.45"/><circle cx="1110" cy="38" r="1.2" opacity="0.55"/>
    <circle cx="1160" cy="120" r="0.9" opacity="0.4"/><circle cx="40" cy="150" r="0.9" opacity="0.4"/>
  </g>

  <!-- back skyline -->
  <g fill="#1b0636" opacity="0.9">
    <rect x="0" y="236" width="44" height="84"/><rect x="40" y="214" width="30" height="106"/>
    <rect x="72" y="248" width="52" height="72"/><rect x="128" y="196" width="26" height="124"/>
    <rect x="160" y="258" width="60" height="62"/><rect x="226" y="230" width="34" height="90"/>
    <rect x="300" y="262" width="70" height="58"/><rect x="380" y="270" width="60" height="50"/>
    <rect x="760" y="268" width="66" height="52"/><rect x="830" y="252" width="40" height="68"/>
    <rect x="1050" y="222" width="38" height="98"/><rect x="1092" y="246" width="56" height="74"/>
    <rect x="1150" y="206" width="50" height="114"/>
  </g>

  <!-- front skyline -->
  <g fill="#0a0219" stroke="#ff2a6d" stroke-opacity="0.55" stroke-width="1">
    <rect x="12" y="262" width="58" height="58"/><rect x="84" y="226" width="36" height="94"/>
    <rect x="186" y="244" width="48" height="76"/><rect x="250" y="276" width="70" height="44"/>
    <rect x="440" y="284" width="80" height="36"/><rect x="680" y="284" width="74" height="36"/>
    <rect x="870" y="270" width="48" height="50"/><rect x="1096" y="258" width="42" height="62"/>
    <rect x="1150" y="236" width="50" height="84"/>
  </g>

  <!-- antenna beacons -->
  <g fill="#ff2a6d">
    <line x1="102" y1="226" x2="102" y2="204" stroke="#ff2a6d" stroke-width="1"/>
    <circle class="beacon" cx="102" cy="203" r="2.5"/>
    <line x1="1175" y1="236" x2="1175" y2="212" stroke="#ff2a6d" stroke-width="1"/>
    <circle class="beacon" cx="1175" cy="211" r="2.5" style="animation-delay:-0.8s"/>
  </g>

  <!-- lit windows -->
  <g fill="#05d9e8">
    <rect class="win" x="92" y="238" width="4" height="3"/><rect class="win d1" x="106" y="250" width="4" height="3"/>
    <rect class="win d2" x="92" y="270" width="4" height="3"/><rect class="win d3" x="196" y="256" width="4" height="3"/>
    <rect class="win" x="214" y="272" width="4" height="3"/><rect class="win d1" x="20" y="276" width="4" height="3"/>
    <rect class="win d2" x="1104" y="270" width="4" height="3"/><rect class="win d3" x="1122" y="286" width="4" height="3"/>
    <rect class="win" x="1160" y="250" width="4" height="3"/><rect class="win d1" x="1180" y="268" width="4" height="3"/>
    <rect class="win d2" x="880" y="282" width="4" height="3"/><rect class="win d3" x="900" y="296" width="4" height="3"/>
  </g>
  <g fill="#ff2a6d">
    <rect class="win d2" x="40" y="292" width="4" height="3"/><rect class="win d3" x="262" y="288" width="4" height="3"/>
    <rect class="win" x="1170" y="290" width="4" height="3"/><rect class="win d1" x="700" y="296" width="4" height="3"/>
  </g>

  <!-- Taipei 101 -->
  <g fill="#0a0219" stroke="#05d9e8" stroke-width="1.2" filter="url(#softGlow)">
    <rect x="985" y="270" width="50" height="50"/>
    <use href="#seg101" x="1010" y="270"/>
    <use href="#seg101" x="1010" y="253"/>
    <use href="#seg101" x="1010" y="236"/>
    <use href="#seg101" x="1010" y="219"/>
    <use href="#seg101" x="1010" y="202"/>
    <use href="#seg101" x="1010" y="185"/>
    <use href="#seg101" x="1010" y="168"/>
    <use href="#seg101" x="1010" y="151"/>
    <rect x="1000" y="122" width="20" height="12"/>
    <rect x="1004" y="112" width="12" height="10"/>
    <line x1="1010" y1="112" x2="1010" y2="66"/>
  </g>
  <circle class="beacon" cx="1010" cy="64" r="3" fill="#ff2a6d"/>

  <!-- perspective floor grid -->
  <g stroke="url(#floorFade)" stroke-width="1" opacity="0.75">
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="326" x2="1200" y2="326"/>
    <line x1="0" y1="334" x2="1200" y2="334"/>
    <line x1="0" y1="345" x2="1200" y2="345"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="380" x2="1200" y2="380"/>
    <line x1="0" y1="406" x2="1200" y2="406"/>
    <line x1="0" y1="438" x2="1200" y2="438"/>
    <line x1="600" y1="320" x2="600" y2="440"/>
    <line x1="560" y1="320" x2="360" y2="440"/><line x1="640" y1="320" x2="840" y2="440"/>
    <line x1="520" y1="320" x2="120" y2="440"/><line x1="680" y1="320" x2="1080" y2="440"/>
    <line x1="480" y1="320" x2="-120" y2="440"/><line x1="720" y1="320" x2="1320" y2="440"/>
    <line x1="440" y1="320" x2="-360" y2="440"/><line x1="760" y1="320" x2="1560" y2="440"/>
    <line x1="400" y1="320" x2="-600" y2="440"/><line x1="800" y1="320" x2="1800" y2="440"/>
  </g>
  <rect class="sweep" x="0" y="0" width="1200" height="2" fill="#05d9e8" opacity="0.5"/>

  <!-- rain -->
  <g>
    <line class="rain" x1="60" y1="0" x2="56" y2="26"/><line class="rain b" x1="150" y1="-80" x2="146" y2="-54" style="animation-delay:-0.3s"/>
    <line class="rain c" x1="260" y1="-40" x2="256" y2="-14" style="animation-delay:-0.9s"/><line class="rain" x1="340" y1="-120" x2="336" y2="-94" style="animation-delay:-0.5s"/>
    <line class="rain b" x1="430" y1="-20" x2="426" y2="6" style="animation-delay:-0.1s"/><line class="rain c" x1="520" y1="-160" x2="516" y2="-134" style="animation-delay:-0.2s"/>
    <line class="rain" x1="610" y1="-60" x2="606" y2="-34" style="animation-delay:-0.7s"/><line class="rain b" x1="700" y1="-100" x2="696" y2="-74" style="animation-delay:-0.6s"/>
    <line class="rain c" x1="790" y1="-10" x2="786" y2="16" style="animation-delay:-1.2s"/><line class="rain" x1="880" y1="-140" x2="876" y2="-114" style="animation-delay:-0.4s"/>
    <line class="rain b" x1="960" y1="-30" x2="956" y2="-4" style="animation-delay:-0.45s"/><line class="rain c" x1="1060" y1="-90" x2="1056" y2="-64" style="animation-delay:-0.35s"/>
    <line class="rain" x1="1140" y1="-50" x2="1136" y2="-24" style="animation-delay:-0.85s"/><line class="rain b" x1="1190" y1="-130" x2="1186" y2="-104" style="animation-delay:-0.15s"/>
  </g>

  <!-- HUD frame -->
  <g fill="none" stroke="#05d9e8" stroke-width="2" opacity="0.8">
    <path d="M20 48 V20 H48"/><path d="M1152 20 H1180 V48"/>
    <path d="M20 392 V420 H48"/><path d="M1152 420 H1180 V392"/>
  </g>
  <g class="mono" font-size="12" letter-spacing="2" fill="#05d9e8" opacity="0.85">
    <text x="60" y="36">◢ FREETWAI://NODE.TW</text>
    <text x="1140" y="36" text-anchor="end">LAT 23.5°N · LON 121.0°E</text>
    <text x="60" y="412">SYS.STATUS <tspan fill="#ff2a6d">INCUBATING</tspan></text>
    <text x="1140" y="412" text-anchor="end">ACCESS ▸ <tspan fill="#ff2a6d">OPEN</tspan><tspan class="blink"> █</tspan></text>
  </g>

  <!-- glitch title -->
  <g class="mono" font-size="104" font-weight="800" letter-spacing="10" text-anchor="middle">
    <text class="glitchC" x="600" y="170" fill="#05d9e8">FREETWAI</text>
    <text class="glitchM" x="600" y="170" fill="#ff2a6d">FREETWAI</text>
    <text x="600" y="170" fill="url(#neon)" filter="url(#softGlow)">FREETWAI</text>
  </g>

  <!-- subtitle -->
  <g class="flicker" filter="url(#glow)">
    <text class="cjk" x="600" y="222" text-anchor="middle" font-size="28" font-weight="700" letter-spacing="14" fill="#ffffff">自由工坊<tspan class="mono" font-size="20" letter-spacing="6" fill="#05d9e8">  //  FREEDOM PLATFORM</tspan></text>
  </g>

  <!-- tagline plate on the floor -->
  <g>
    <rect x="370" y="334" width="460" height="58" fill="#05010d" fill-opacity="0.78" stroke="#ff2a6d" stroke-width="1.5"/>
    <path d="M370 334 l12 0 M818 392 l12 0" stroke="#05d9e8" stroke-width="3"/>
    <text class="mono" x="600" y="358" text-anchor="middle" font-size="15" letter-spacing="4" fill="#05d9e8">NO GATEKEEPERS · ONLY BUILDERS</text>
    <text class="cjk" x="600" y="382" text-anchor="middle" font-size="15" letter-spacing="6" fill="#ffffff" opacity="0.9">沒有守門人，只有建造者</text>
  </g>

  <!-- CRT scanlines -->
  <rect width="1200" height="440" fill="url(#scan)" pointer-events="none"/>
</svg>
