<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="1200" height="230" role="img" aria-labelledby="title desc">
  <title id="title">自由工坊上線協議</title>
  <desc id="desc">五個節點：01 定位、02 公會、03 技能書、04 小隊、05 成果，以霓虹電路串連。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07020f"/>
      <stop offset="1" stop-color="#14022e"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#05d9e8"/>
      <stop offset="1" stop-color="#ff2a6d"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#05d9e8" fill-opacity="0.12"/>
    </pattern>
    <polygon id="hex" points="0,-44 38,-22 38,22 0,44 -38,22 -38,-22"/>
    <style>
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; }
      .cjk  { font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', 'Heiti TC', sans-serif; }
      .pulse { stroke-dasharray: 60 1040; animation: run 3.5s linear infinite; }
      @keyframes run { from { stroke-dashoffset: 1100; } to { stroke-dashoffset: 0; } }
      .node { animation: lit 3.5s linear infinite; }
      .n2 { animation-delay: 0.7s; } .n3 { animation-delay: 1.4s; } .n4 { animation-delay: 2.1s; } .n5 { animation-delay: 2.8s; }
      @keyframes lit { 0%, 12% { stroke-width: 3.5; } 20%, 100% { stroke-width: 1.5; } }
    </style>
  </defs>

  <rect width="1200" height="230" fill="url(#bg)"/>
  <rect width="1200" height="230" fill="url(#dots)"/>
  <g fill="none" stroke="#ff2a6d" stroke-width="1.5" opacity="0.7">
    <path d="M10 30 V10 H30"/><path d="M1170 10 H1190 V30"/>
    <path d="M10 200 V220 H30"/><path d="M1170 220 H1190 V200"/>
  </g>
  <text class="mono" x="40" y="30" font-size="11" letter-spacing="3" fill="#05d9e8" opacity="0.8">◢ BOOT SEQUENCE // 自由工坊上線協議</text>

  <!-- circuit: base wire + travelling pulse -->
  <path d="M50 100 H1150" stroke="#2a0b4a" stroke-width="3"/>
  <path class="pulse" d="M50 100 H1150" stroke="url(#wire)" stroke-width="3" filter="url(#glow)"/>

  <!-- nodes -->
  <g fill="#0a0219" filter="url(#glow)">
    <use class="node"    href="#hex" x="160"  y="100" stroke="#05d9e8"/>
    <use class="node n2" href="#hex" x="380"  y="100" stroke="#3fb8ff"/>
    <use class="node n3" href="#hex" x="600"  y="100" stroke="#a66bff"/>
    <use class="node n4" href="#hex" x="820"  y="100" stroke="#e14dc8"/>
    <use class="node n5" href="#hex" x="1040" y="100" stroke="#ff2a6d"/>
  </g>

  <g text-anchor="middle">
    <g class="mono" font-size="12" letter-spacing="2" fill="#05d9e8" opacity="0.85">
      <text x="160"  y="82">01</text><text x="380" y="82">02</text><text x="600" y="82">03</text>
      <text x="820"  y="82">04</text><text x="1040" y="82">05</text>
    </g>
    <g class="cjk" font-size="20" font-weight="700" fill="#ffffff">
      <text x="160" y="110">定位</text><text x="380" y="110">公會</text><text x="600" y="110">技能書</text>
      <text x="820" y="110">小隊</text><text x="1040" y="110">成果</text>
    </g>
    <g class="mono" font-size="13" letter-spacing="3" fill="#ff2a6d">
      <text x="160" y="170">LOCATE</text><text x="380" y="170">GUILD</text><text x="600" y="170">SKILL.BOOK</text>
      <text x="820" y="170">SQUAD</text><text x="1040" y="170">SHIP</text>
    </g>
    <g class="cjk" font-size="13" fill="#c9c3e6">
      <text x="160" y="194">找到你的座標</text>
      <text x="380" y="194">選擇你的公會</text>
      <text x="600" y="194">領取 Repo 技能書</text>
      <text x="820" y="194">供貨・商店・開源・行銷</text>
      <text x="1040" y="194">一起交付真實成果</text>
    </g>
  </g>
</svg>
